<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>

    <style>
        div#conteiner {
            background-color: cornflowerblue;
            display: flex;
            flex-flow: row nowrap;
        }

        div#item {  
            background-color: hotpink ;
            border: 1px solid rgb(231, 5, 114);
            text-align: center;
            flex-basis: 300px;
            
           
        }

       div.cxA {
        flex-shrink: 3;
        flex-grow: 1;
       } 

       div.cxB {
        flex-shrink: 1;
        flex-grow: 1;
       }

       div.cxC {
        flex-shrink: 3;
        flex-grow: 1;
       }

    </style>

</head>
<body>
    <div id="conteiner">
        <div id="item" class="cxA">A</div>
        <div id="item" class="cxB">B</div>
        <div id="item" class="cxC">C</div>
        
    </div>
</body>
</html>
